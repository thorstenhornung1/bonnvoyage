rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration registers no custom actions.
  appropriate-polling: done
  brands:
    status: exempt
    comment: Custom integration, not in the brands repository.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration registers no custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities subscribe only via the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  config-entry-unloading: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  action-exceptions:
    status: exempt
    comment: Integration registers no custom actions.
  docs-configuration-parameters: done
  docs-installation-parameters: done
  reauthentication-flow: done
  test-coverage: done
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service, not discoverable on the network.
  entity-category:
    status: exempt
    comment: All entities are primary data; none are config or diagnostic.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: Every entity carries primary value for automations or the map.
  entity-translations: done
  exception-translations:
    status: exempt
    comment: No custom service actions; flow errors are translated via strings.
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues: done
  stale-devices: done
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
