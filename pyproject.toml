[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=custom_components.bonnvoyage --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/bonnvoyage"]
branch = true

[tool.coverage.report]
fail_under = 92
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.bonnvoyage"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
